name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Test
        run: cargo test --target ${{ matrix.target }}

      - name: Release build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: holter-analysis-assist-linux-x86_64
          path: target/${{ matrix.target }}/release/holter-analysis-assist

      - name: Upload binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: holter-analysis-assist-windows-x86_64
          path: target/${{ matrix.target }}/release/holter-analysis-assist.exe

  # ---------------------------------------------------------------------------
  # CiEmbedRelease (model-embedding): embedded CLI release for Win/Linux x86_64.
  #
  # Secrets (repository / environment):
  #   HOLTER_EMBEDDED_MODEL_URL          — Primary. HTTPS URL to production-size
  #                                        ONNX (~64MB). GH Actions secrets max
  #                                        ~48KB and cannot hold the model as B64.
  #   HOLTER_EMBEDDED_MODEL_AUTH_HEADER  — Optional. Value for curl Authorization
  #                                        header when the URL requires auth.
  #   HOLTER_EMBEDDED_MODEL_B64          — Secondary (dev/fixture only). Base64 of
  #                                        a tiny model; subject to ~48KB secret
  #                                        size limit. Ignored when URL is set.
  #
  # Soft-skip: when neither URL nor B64 is set, this job is skipped (CI stays green).
  # Job / artifact family name: release-embedded-cli
  # Out of scope: packaging, holter-http-api, license / installer steps.
  # ---------------------------------------------------------------------------
  release-embedded-cli:
    name: release-embedded-cli (${{ matrix.target }})
    # Soft-skip when neither inject secret is configured (keeps CI green).
    if: ${{ secrets.HOLTER_EMBEDDED_MODEL_URL != '' || secrets.HOLTER_EMBEDDED_MODEL_B64 != '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: embed-${{ matrix.target }}

      - name: Materialize model for embed inject
        shell: bash
        env:
          HOLTER_EMBEDDED_MODEL_URL: ${{ secrets.HOLTER_EMBEDDED_MODEL_URL }}
          HOLTER_EMBEDDED_MODEL_AUTH_HEADER: ${{ secrets.HOLTER_EMBEDDED_MODEL_AUTH_HEADER }}
          HOLTER_EMBEDDED_MODEL_B64: ${{ secrets.HOLTER_EMBEDDED_MODEL_B64 }}
        run: |
          set -euo pipefail
          # Soft-skip documentation: when neither URL nor B64 is set at the repo
          # level, the job-level if: skips this job entirely (CI stays green).
          echo "Inject policy: primary=HOLTER_EMBEDDED_MODEL_URL (production-size);"
          echo "  secondary=HOLTER_EMBEDDED_MODEL_B64 (dev/fixture only, GH secret max ~48KB)."
          echo "  Soft-skip when neither secret is set (job if: URL OR B64)."

          MODEL_DIR="${RUNNER_TEMP}/holter-embed-model"
          mkdir -p "$MODEL_DIR"
          MODEL_PATH="${MODEL_DIR}/embedded_model.bin"

          if [[ -n "${HOLTER_EMBEDDED_MODEL_URL:-}" ]]; then
            echo "Primary path: downloading model from HOLTER_EMBEDDED_MODEL_URL"
            if [[ -n "${HOLTER_EMBEDDED_MODEL_AUTH_HEADER:-}" ]]; then
              curl -fsSL \
                -H "Authorization: ${HOLTER_EMBEDDED_MODEL_AUTH_HEADER}" \
                -o "${MODEL_PATH}" \
                "${HOLTER_EMBEDDED_MODEL_URL}"
            else
              curl -fsSL -o "${MODEL_PATH}" "${HOLTER_EMBEDDED_MODEL_URL}"
            fi
          elif [[ -n "${HOLTER_EMBEDDED_MODEL_B64:-}" ]]; then
            echo "Secondary path: decoding HOLTER_EMBEDDED_MODEL_B64 (dev/fixture;"
            echo "  GitHub Actions secret size limit ~48KB — not for production ONNX)"
            export MODEL_PATH
            python3 -c '
          import base64, os, sys
          path = os.environ["MODEL_PATH"]
          data = base64.b64decode(os.environ["HOLTER_EMBEDDED_MODEL_B64"], validate=False)
          if not data:
              sys.exit("HOLTER_EMBEDDED_MODEL_B64 decoded to empty bytes")
          open(path, "wb").write(data)
          print("Materialized embed model at %s (%d bytes)" % (path, len(data)))
          '
          else
            echo "Neither HOLTER_EMBEDDED_MODEL_URL nor HOLTER_EMBEDDED_MODEL_B64 is set;"
            echo "soft-skip expected at job if: — failing closed if reached."
            exit 1
          fi

          if [[ ! -s "$MODEL_PATH" ]]; then
            echo "Materialized model file is missing or empty: ${MODEL_PATH}" >&2
            exit 1
          fi
          SIZE=$(wc -c < "$MODEL_PATH" | tr -d ' ')
          echo "Materialized embed model at ${MODEL_PATH} (${SIZE} bytes)"
          echo "HOLTER_EMBEDDED_MODEL_PATH=${MODEL_PATH}" >> "$GITHUB_ENV"

      - name: Release build (embedded-model, CPU)
        # --no-default-features avoids CUDA dylib requirements on GH runners.
        # Distribution default for this artifact is CPU (design: CiEmbedRelease).
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features embedded-model

      - name: Log release binary size
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/holter-analysis-assist"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="${BIN}.exe"
          fi
          SIZE=$(wc -c < "$BIN" | tr -d ' ')
          echo "release-embedded-cli binary size: ${SIZE} bytes"
          # Requirement 6.2: never suppress / hide sizes even if >100MB
          if (( SIZE > 104857600 )); then
            echo "note: binary exceeds 100MiB (${SIZE} bytes); recorded without suppression"
          fi

      - name: Upload embedded CLI (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          # Artifact family: release-embedded-cli (suffix for matrix uniqueness on upload-artifact@v4)
          name: release-embedded-cli-linux-x86_64
          path: target/${{ matrix.target }}/release/holter-analysis-assist
          if-no-files-found: error

      - name: Upload embedded CLI (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-embedded-cli-windows-x86_64
          path: target/${{ matrix.target }}/release/holter-analysis-assist.exe
          if-no-files-found: error

  release-embedded-http-api:
    # -------------------------------------------------------------------------
    # CiEmbedHttpRelease (http-api): embedded holter-http-api for Win/Linux
    # x86_64. Same inject secrets as release-embedded-cli:
    #   HOLTER_EMBEDDED_MODEL_URL          — Primary production-size ONNX URL
    #                                        (GH secrets max ~48KB; B64 cannot
    #                                        hold production ONNX).
    #   HOLTER_EMBEDDED_MODEL_AUTH_HEADER  — Optional curl Authorization header.
    #   HOLTER_EMBEDDED_MODEL_B64          — Secondary dev/fixture only (~48KB
    #                                        GitHub Actions secret size limit).
    # Soft-skip when neither URL nor B64 is set. Artifact family:
    # release-embedded-http-api. Out of scope: distribution packaging steps;
    # does not redefine release-embedded-cli (model-embedding OWN).
    # -------------------------------------------------------------------------
    name: release-embedded-http-api (${{ matrix.target }})
    # Soft-skip when neither inject secret is configured (keeps CI green).
    if: ${{ secrets.HOLTER_EMBEDDED_MODEL_URL != '' || secrets.HOLTER_EMBEDDED_MODEL_B64 != '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: embed-http-${{ matrix.target }}

      - name: Materialize model for embed inject
        shell: bash
        env:
          HOLTER_EMBEDDED_MODEL_URL: ${{ secrets.HOLTER_EMBEDDED_MODEL_URL }}
          HOLTER_EMBEDDED_MODEL_AUTH_HEADER: ${{ secrets.HOLTER_EMBEDDED_MODEL_AUTH_HEADER }}
          HOLTER_EMBEDDED_MODEL_B64: ${{ secrets.HOLTER_EMBEDDED_MODEL_B64 }}
        run: |
          set -euo pipefail
          # Soft-skip documentation: when neither URL nor B64 is set at the repo
          # level, the job-level if: skips this job entirely (CI stays green).
          echo "Inject policy: primary=HOLTER_EMBEDDED_MODEL_URL (production-size);"
          echo "  secondary=HOLTER_EMBEDDED_MODEL_B64 (dev/fixture only, GH secret max ~48KB)."
          echo "  Soft-skip when neither secret is set (job if: URL OR B64)."

          MODEL_DIR="${RUNNER_TEMP}/holter-embed-model"
          mkdir -p "$MODEL_DIR"
          MODEL_PATH="${MODEL_DIR}/embedded_model.bin"

          if [[ -n "${HOLTER_EMBEDDED_MODEL_URL:-}" ]]; then
            echo "Primary path: downloading model from HOLTER_EMBEDDED_MODEL_URL"
            if [[ -n "${HOLTER_EMBEDDED_MODEL_AUTH_HEADER:-}" ]]; then
              curl -fsSL \
                -H "Authorization: ${HOLTER_EMBEDDED_MODEL_AUTH_HEADER}" \
                -o "${MODEL_PATH}" \
                "${HOLTER_EMBEDDED_MODEL_URL}"
            else
              curl -fsSL -o "${MODEL_PATH}" "${HOLTER_EMBEDDED_MODEL_URL}"
            fi
          elif [[ -n "${HOLTER_EMBEDDED_MODEL_B64:-}" ]]; then
            echo "Secondary path: decoding HOLTER_EMBEDDED_MODEL_B64 (dev/fixture;"
            echo "  GitHub Actions secret size limit ~48KB — not for production ONNX)"
            export MODEL_PATH
            python3 -c '
          import base64, os, sys
          path = os.environ["MODEL_PATH"]
          data = base64.b64decode(os.environ["HOLTER_EMBEDDED_MODEL_B64"], validate=False)
          if not data:
              sys.exit("HOLTER_EMBEDDED_MODEL_B64 decoded to empty bytes")
          open(path, "wb").write(data)
          print("Materialized embed model at %s (%d bytes)" % (path, len(data)))
          '
          else
            echo "Neither HOLTER_EMBEDDED_MODEL_URL nor HOLTER_EMBEDDED_MODEL_B64 is set;"
            echo "soft-skip expected at job if: — failing closed if reached."
            exit 1
          fi

          if [[ ! -s "$MODEL_PATH" ]]; then
            echo "Materialized model file is missing or empty: ${MODEL_PATH}" >&2
            exit 1
          fi
          SIZE=$(wc -c < "$MODEL_PATH" | tr -d ' ')
          echo "Materialized embed model at ${MODEL_PATH} (${SIZE} bytes)"
          echo "HOLTER_EMBEDDED_MODEL_PATH=${MODEL_PATH}" >> "$GITHUB_ENV"

      - name: Release build (embedded-model, CPU, holter-http-api)
        # --no-default-features avoids CUDA dylib requirements on GH runners.
        # Distribution default for this artifact is CPU (design: CiEmbedHttpRelease).
        run: cargo build --release --target ${{ matrix.target }} --bin holter-http-api --no-default-features --features embedded-model

      - name: Log release binary size
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/holter-http-api"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="${BIN}.exe"
          fi
          SIZE=$(wc -c < "$BIN" | tr -d ' ')
          echo "release-embedded-http-api binary size: ${SIZE} bytes"
          # Never suppress / hide sizes even if >100MB
          if (( SIZE > 104857600 )); then
            echo "note: binary exceeds 100MiB (${SIZE} bytes); recorded without suppression"
          fi

      - name: Upload embedded HTTP API (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          # Artifact family: release-embedded-http-api (suffix for matrix uniqueness on upload-artifact@v4)
          name: release-embedded-http-api-linux-x86_64
          path: target/${{ matrix.target }}/release/holter-http-api
          if-no-files-found: error

      - name: Upload embedded HTTP API (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-embedded-http-api-windows-x86_64
          path: target/${{ matrix.target }}/release/holter-http-api.exe
          if-no-files-found: error

  package-windows:
    # ReleasePublish (packaging-distribution): CPU-default Windows installer.
    # Input (consume only): artifact family release-embedded-http-api
    #   (embedded holter-http-api from http-api CiEmbedHttpRelease).
    # Packaging OWN jobs: package-windows / package-linux
    # Out of scope: do NOT redefine release-embedded-cli (model-embedding OWN).
    # CUDA packaging is optional and separate — not part of this required CPU gate.
    # Required packaging gate applies only when release-embedded-http-api succeeds.
    # Soft-skip of upstream (no embed secrets) ⇒ packaging also skips via needs:
    #   (keeps CI green; not a fail-open / silent packaging success).
    # When packaging does run: missing artifact or verify/build failure → fail-closed.
    name: package-windows (windows-x86_64-cpu)
    needs: release-embedded-http-api
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release-embedded-http-api (Windows)
        uses: actions/download-artifact@v4
        with:
          # Upstream family: release-embedded-http-api (matrix suffix for uniqueness).
          # download-artifact fails if this artifact is missing (fail-closed).
          name: release-embedded-http-api-windows-x86_64
          path: ${{ runner.temp }}/release-embedded-http-api

      - name: Resolve downloaded binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find "${RUNNER_TEMP}/release-embedded-http-api" -type f \( -name 'holter-http-api.exe' -o -name 'holter-http-api' \) | head -n1)"
          if [[ -z "${BIN}" || ! -f "${BIN}" ]]; then
            echo "error: release-embedded-http-api binary missing after download" >&2
            exit 1
          fi
          echo "Downloaded embedded HTTP binary: ${BIN}"
          echo "HOLTER_PKG_BINARY=${BIN}" >> "$GITHUB_ENV"

      - name: Install Inno Setup
        shell: bash
        run: |
          set -euo pipefail
          choco install innosetup -y --no-progress

      - name: Prepare staging and verify
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/scripts/prepare-staging.sh \
            --os windows \
            --binary "${HOLTER_PKG_BINARY}"
          bash packaging/scripts/verify-artifact.sh packaging/out/staging/windows

      - name: Build Inno installer
        shell: bash
        run: |
          set -euo pipefail
          # Prefer tag-like ref names; otherwise Cargo.toml default (fpm/Inno-safe).
          VER="${GITHUB_REF_NAME:-0.1.0}"
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+ ]]; then
            VER="0.1.0"
          fi
          bash packaging/scripts/build-inno.sh --version "${VER}"

      - name: Upload Windows installer (cpu)
        uses: actions/upload-artifact@v4
        with:
          # OS / arch / cpu identifiable (Req 5.4 / 8.2)
          name: packaging-windows-installer-windows-x86_64-cpu
          path: packaging/out/windows/*
          if-no-files-found: error

  package-linux:
    # ReleasePublish: CPU-default Linux Docker + deb/rpm.
    # Consumes release-embedded-http-api; CUDA remains optional/separate.
    # Required packaging gate applies only when release-embedded-http-api succeeds.
    # Soft-skip of upstream ⇒ packaging also skips (needs:; CI stays green).
    name: package-linux (linux-x86_64-cpu)
    needs: release-embedded-http-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release-embedded-http-api (Linux)
        uses: actions/download-artifact@v4
        with:
          # Upstream family: release-embedded-http-api (matrix suffix for uniqueness).
          # download-artifact fails if this artifact is missing (fail-closed).
          name: release-embedded-http-api-linux-x86_64
          path: ${{ runner.temp }}/release-embedded-http-api

      - name: Resolve downloaded binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find "${RUNNER_TEMP}/release-embedded-http-api" -type f -name 'holter-http-api' | head -n1)"
          if [[ -z "${BIN}" || ! -f "${BIN}" ]]; then
            echo "error: release-embedded-http-api binary missing after download" >&2
            exit 1
          fi
          chmod +x "${BIN}"
          echo "Downloaded embedded HTTP binary: ${BIN}"
          echo "HOLTER_PKG_BINARY=${BIN}" >> "$GITHUB_ENV"

      - name: Install fpm and rpm tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ruby ruby-dev build-essential rpm
          sudo gem install fpm --no-document

      - name: Prepare staging and verify
        run: |
          set -euo pipefail
          bash packaging/scripts/prepare-staging.sh \
            --os linux \
            --binary "${HOLTER_PKG_BINARY}"
          bash packaging/scripts/verify-artifact.sh packaging/out/staging/linux

      - name: Build Docker image (cpu)
        run: |
          set -euo pipefail
          TAG="holter-http-api:ci-linux-x86_64-cpu"
          bash packaging/scripts/build-docker.sh --tag "${TAG}"
          mkdir -p packaging/out/docker
          docker save "${TAG}" | gzip > packaging/out/docker/holter-http-api-linux-x86_64-cpu.tar.gz

      - name: Build deb and rpm (cpu)
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME:-0.1.0}"
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+ ]]; then
            VER="0.1.0"
          fi
          bash packaging/linux/fpm.sh --version "${VER}"

      - name: Upload Docker image archive (cpu)
        uses: actions/upload-artifact@v4
        with:
          name: packaging-docker-linux-x86_64-cpu
          path: packaging/out/docker/holter-http-api-linux-x86_64-cpu.tar.gz
          if-no-files-found: error

      - name: Upload deb package (cpu)
        uses: actions/upload-artifact@v4
        with:
          name: packaging-deb-linux-x86_64-cpu
          path: packaging/out/linux/*.deb
          if-no-files-found: error

      - name: Upload rpm package (cpu)
        uses: actions/upload-artifact@v4
        with:
          name: packaging-rpm-linux-x86_64-cpu
          path: packaging/out/linux/*.rpm
          if-no-files-found: error
