<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holter Analysis Assist コンソール</title>
  <!-- Bulma: layout / forms without a SPA build -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="console.css">
</head>
<body>
  <header class="console-topbar">
    <div class="console-topbar__brand">
      <h1 class="title is-4 mb-0">Holter Analysis Assist</h1>
      <p class="console-topbar__sub">簡易コンソール — ECL の単発解析</p>
    </div>
    <div
      id="health-status"
      class="console-health"
      role="status"
      aria-live="polite"
      title="10秒ごとに自動確認"
    >
      <span class="console-health__dot" aria-hidden="true"></span>
      <span id="health-label">ヘルス確認中…</span>
    </div>
  </header>

  <main class="section console-main pt-4">
    <div class="container is-fluid">
      <p id="guidance" class="console-guidance mb-4">
        この画面の左で ECL を選び解析を実行し、右に結果が表示されます。
        ヘルス状態は画面右上で自動更新されます（ボタン操作は不要です）。
      </p>

      <div class="columns is-desktop is-variable is-4">
        <!-- Left ~1/3: input -->
        <div class="column is-one-third-desktop">
          <div class="box console-panel">
            <h2 class="title is-5">入力</h2>

            <div class="field">
              <label class="label" for="ecl-file">ECL ファイルを選択</label>
              <div class="control">
                <div class="file has-name is-fullwidth">
                  <label class="file-label">
                    <input class="file-input" type="file" id="ecl-file" name="ecl" accept=".ecl,application/octet-stream">
                    <span class="file-cta">
                      <span class="file-label">ファイルを選択…</span>
                    </span>
                    <span class="file-name" id="ecl-filename">未選択</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="field">
              <label class="label" for="format-select">出力形式</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select id="format-select">
                    <option value="json" selected>JSON（既定）</option>
                    <option value="csv">CSV</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="field">
              <div class="control">
                <button type="button" class="button is-link is-fullwidth" id="analyze-btn">
                  解析を実行
                </button>
              </div>
            </div>

            <p id="loading" class="help is-info console-loading" hidden aria-live="polite">
              処理中です。完了までお待ちください…
            </p>

            <div id="error" class="notification is-danger is-light mt-3" role="alert" aria-live="assertive" hidden></div>
          </div>
        </div>

        <!-- Right ~2/3: output -->
        <div class="column is-two-thirds-desktop">
          <div class="box console-panel console-panel--output">
            <div class="level is-mobile mb-3">
              <div class="level-left">
                <h2 class="title is-5 mb-0">出力</h2>
              </div>
              <div class="level-right">
                <button
                  type="button"
                  class="button is-success"
                  id="download-btn"
                  hidden
                  disabled
                >
                  結果をダウンロード
                </button>
              </div>
            </div>
            <p id="timing-status" class="console-timing" hidden aria-live="polite">
              <span id="timing-label">処理時間</span>:
              <strong id="timing-value">—</strong>
            </p>
            <pre id="result" class="console-result" aria-live="polite"></pre>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="console.js"></script>
</body>
</html>
