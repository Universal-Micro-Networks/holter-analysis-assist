[package]
name = "holter-analysis-assist"
version = "0.1.0"
edition = "2021"
description = "Holter ECG arrhythmia classification assist (CLI first, API later)"
license = "MIT"
readme = "README.md"
rust-version = "1.74"

[features]
default = ["cuda"]
# ONNX Runtime CUDA EP (NVIDIA GPU). Needs CUDA Toolkit ≥13.2 + cuDNN on PATH at runtime.
cuda = ["ort/cuda"]
# Build-time model embedding for release/distribution. Not in default.
# Requires HOLTER_EMBEDDED_MODEL_PATH pointing to a readable non-empty model file.
embedded-model = []

[dependencies]
axum = "0.7.9"
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
ini = { package = "rust-ini", version = "0.21" }
ndarray = "0.17"
# lax-feature-matching: tolerate EP feature sets without an exact multi-EP prebuilt binary.
ort = { version = "=2.0.0-rc.13", default-features = true, features = ["lax-feature-matching"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.5", features = ["limit", "timeout"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "holter-analysis-assist"
path = "src/main.rs"

[[bin]]
name = "holter-http-api"
path = "src/bin/holter_http_api.rs"

[[example]]
name = "bench_infer"
path = "examples/bench_infer.rs"
