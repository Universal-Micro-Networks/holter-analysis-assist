[package]
name = "holter-analysis-assist"
version = "0.1.0"
edition = "2021"
description = "Holter ECG arrhythmia classification assist (CLI first, API later)"
license = "MIT"
readme = "README.md"
rust-version = "1.74"

[features]
default = ["cuda", "coreml"]
# ONNX Runtime CUDA EP (NVIDIA GPU). Needs CUDA Toolkit ≥13.2 + cuDNN on PATH at runtime.
cuda = ["ort/cuda"]
# ONNX Runtime CoreML EP (Apple GPU / Neural Engine). Effective on macOS/iOS only.
coreml = ["ort/coreml"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
ndarray = "0.17"
# lax-feature-matching: allow cuda+coreml without an exact multi-EP prebuilt binary.
ort = { version = "=2.0.0-rc.13", default-features = true, features = ["lax-feature-matching"] }
regex = "1.11"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

[[bin]]
name = "holter-analysis-assist"
path = "src/main.rs"

[[example]]
name = "bench_infer"
path = "examples/bench_infer.rs"
