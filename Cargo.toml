[package]
name = "holter-analysis-assist"
version = "0.1.0"
edition = "2021"
description = "Holter ECG arrhythmia classification assist (CLI first, API later)"
license = "MIT"
readme = "README.md"
rust-version = "1.74"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

[[bin]]
name = "holter-analysis-assist"
path = "src/main.rs"
